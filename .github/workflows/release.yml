name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build a (debug) vorto and use it to compile every built-in grammar
      # for THIS native target into assets/grammars-prebuilt/<target>/ and
      # emit THIRD_PARTY_LICENSES. Runs natively (the runner's host triple
      # equals matrix.target), so the artifacts match the release build's
      # target. Grammars are cc-compiled at -O3 regardless of this build's
      # profile, so a debug bundler is fine and compiles faster.
      - name: Bundle grammars + collect licenses
        run: cargo run --locked -- grammar bundle

      # The bundle step just populated assets/grammars-prebuilt/<target>/
      # for this native host, so the grammar golden tests (indents.scm +
      # textobjects.scm verified against the real grammars) can now load
      # them. They're #[ignore]d in normal CI for lack of these libs, so
      # opt in explicitly here — running per release target.
      - name: Verify grammar queries (indents + text objects)
        run: cargo test --locked grammar_golden -- --include-ignored

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features bundled-grammars

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vorto-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/vorto" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
