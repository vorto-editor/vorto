name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build a (debug) vorto and use it to compile every built-in grammar
      # for THIS native target into assets/grammars-prebuilt/<target>/ and
      # emit THIRD_PARTY_LICENSES. Runs natively (the runner's host triple
      # equals matrix.target), so the artifacts match the release build's
      # target. Grammars are cc-compiled at -O3 regardless of this build's
      # profile, so a debug bundler is fine and compiles faster.

      # Some grammars (e.g. sql, swift) ship no pre-generated `src/parser.c`
      # in their release assets, so `grammar bundle` must run
      # `tree-sitter generate` from `grammar.js` — which needs the
      # tree-sitter CLI on PATH (Node is preinstalled on the runner).
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Bundle grammars + collect licenses
        run: cargo run --locked -- grammar bundle

      # The bundle step just populated assets/grammars-prebuilt/<target>/
      # for this native host, so the grammar golden tests (indents.scm +
      # textobjects.scm verified against the real grammars) can now load
      # them. They're #[ignore]d in normal CI for lack of these libs, so
      # opt in explicitly here — running per release target.
      - name: Verify grammar queries (indents + text objects)
        run: cargo test --locked grammar_golden -- --include-ignored

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features bundled-grammars

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vorto-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/vorto" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

  homebrew:
    name: bump homebrew tap
    needs: build
    # Skip prereleases (tags like v1.2.3-rc1) — only ship stable to Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      # Check out the tap repo (not this one). Needs a token with write
      # access to vorto-editor/homebrew-tap — the default GITHUB_TOKEN only
      # grants access to the current repo, so a PAT / GitHub App token is
      # stored as the HOMEBREW_TAP_TOKEN secret and used both to clone and to
      # push the bump commit back.
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: vorto-editor/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Pull the just-published release tarballs and recompute their hashes,
      # then rewrite the version constant and each platform's sha256 in place.
      # The sha256 lines are keyed off the target triple in the preceding url
      # line, so order in the formula doesn't matter.
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" \
            --repo vorto-editor/vorto \
            --pattern '*.tar.gz' --dir dist

          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            sha=$(sha256sum "dist/vorto-${version}-${target}.tar.gz" | cut -d' ' -f1)
            perl -0pi -e \
              "s{(${target}\.tar\.gz\"\n\s*sha256 \")[0-9a-f]{64}}{\${1}${sha}}" \
              Formula/vorto.rb
          done

          perl -pi -e "s{VORTO_VERSION = \"[^\"]+\"}{VORTO_VERSION = \"${version}\"}" Formula/vorto.rb
          rm -rf dist

      - name: Commit and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date for ${version}"
            exit 0
          fi
          git add Formula/vorto.rb
          git commit -m "vorto ${version}"
          git push

  publish:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
