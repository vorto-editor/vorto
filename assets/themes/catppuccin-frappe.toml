# Catppuccin Frappé — official Helix mapping, Frappé palette.

# ── Syntax ───────────────────────────────────────────────────────────
keyword            = "mauve"
include            = "mauve"
conditional        = "mauve"
repeat             = "mauve"
exception          = "mauve"
namespace          = { fg = "yellow", modifiers = ["italic"] }
"function"         = "blue"
"function.macro"   = "mauve"
"function.builtin" = "blue"
method             = "blue"
constructor        = "sapphire"
type               = "yellow"
"type.builtin"     = "yellow"
string             = "green"
"string.escape"    = "pink"
character          = "teal"
number             = "peach"
boolean            = "peach"
constant           = "peach"
"constant.builtin" = "peach"
comment            = { fg = "overlay2", modifiers = ["italic"] }
parameter          = { fg = "maroon", modifiers = ["italic"] }
"variable.parameter" = { fg = "maroon", modifiers = ["italic"] }
"variable.builtin"   = "red"
property           = "blue"
field              = "blue"
label              = "sapphire"
operator           = "sky"
"punctuation.bracket"   = "overlay2"
"punctuation.delimiter" = "overlay2"
"punctuation.special"   = "sky"
attribute          = "yellow"
tag                = "blue"
"markup.heading"        = { fg = "blue", modifiers = ["bold"] }
"markup.heading.marker" = "mauve"
"markup.list"           = "teal"
"markup.raw"            = "green"
"markup.link.url"       = { fg = "blue", modifiers = ["underlined"] }
"markup.link.label"     = "lavender"
"diff.plus"             = "green"
"diff.minus"            = "red"

# ── UI chrome ────────────────────────────────────────────────────────
"ui.background"          = { fg = "text", bg = "base" }
"ui.linenr"              = { fg = "surface1" }
"ui.linenr.selected"     = { fg = "lavender" }
"ui.selection"           = { bg = "surface1" }
"ui.search"              = { bg = "surface2" }
"ui.statusline"          = { fg = "subtext1", bg = "mantle" }
"ui.menu.selected"       = { fg = "text", bg = "surface1", modifiers = ["bold"] }
"ui.popup"               = { fg = "text", bg = "surface0" }
"ui.popup.border"        = { fg = "surface2" }

[palette]
rosewater = "#f2d5cf"
flamingo  = "#eebebe"
pink      = "#f4b8e4"
mauve     = "#ca9ee6"
red       = "#e78284"
maroon    = "#ea999c"
peach     = "#ef9f76"
yellow    = "#e5c890"
green     = "#a6d189"
teal      = "#81c8be"
sky       = "#99d1db"
sapphire  = "#85c1dc"
blue      = "#8caaee"
lavender  = "#babbf1"
text      = "#c6d0f5"
subtext1  = "#b5bfe2"
subtext0  = "#a5adce"
overlay2  = "#949cbb"
overlay1  = "#838ba7"
overlay0  = "#737994"
surface2  = "#626880"
surface1  = "#51576d"
surface0  = "#414559"
base      = "#303446"
mantle    = "#292c3c"
crust     = "#232634"
