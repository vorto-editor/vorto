# Kanagawa — ported from the official Helix theme.

# ── Syntax ───────────────────────────────────────────────────────────
keyword            = { fg = "oniViolet", modifiers = ["italic"] }
include            = { fg = "oniViolet", modifiers = ["italic"] }
conditional        = { fg = "oniViolet", modifiers = ["italic"] }
repeat             = { fg = "oniViolet", modifiers = ["italic"] }
exception          = "peachRed"
namespace          = "surimiOrange"
"function"         = "crystalBlue"
"function.macro"   = "waveRed"
"function.builtin" = "springBlue"
method             = "crystalBlue"
constructor        = "springBlue"
type               = "waveAqua2"
"type.builtin"     = "springBlue"
string             = "springGreen"
"string.escape"    = { fg = "boatYellow2", modifiers = ["bold"] }
character          = "springGreen"
number             = "sakuraPink"
boolean            = "surimiOrange"
constant           = "surimiOrange"
"constant.builtin" = "surimiOrange"
comment            = "fujiGray"
parameter          = "oniViolet2"
"variable.parameter" = "oniViolet2"
"variable.builtin"   = "waveRed"
property           = "carpYellow"
field              = "carpYellow"
label              = "springBlue"
operator           = "boatYellow2"
"punctuation.bracket"   = "springViolet2"
"punctuation.delimiter" = "springViolet2"
"punctuation.special"   = "boatYellow2"
attribute          = "waveRed"
tag                = "waveAqua2"
"markup.heading"        = { fg = "springViolet2", modifiers = ["bold"] }
"markup.heading.marker" = "springViolet2"
"markup.list"           = "sakuraPink"
"markup.raw"            = "springGreen"
"markup.link.url"       = "lightBlue"
"markup.link.label"     = "surimiOrange"
"diff.plus"             = "autumnGreen"
"diff.minus"            = "autumnRed"

# ── UI chrome ────────────────────────────────────────────────────────
"ui.background"          = { fg = "fujiWhite", bg = "sumiInk3" }
"ui.linenr"              = { fg = "sumiInk6" }
"ui.linenr.selected"     = { fg = "roninYellow", modifiers = ["bold"] }
"ui.selection"           = { bg = "waveBlue2" }
"ui.search"              = { bg = "waveBlue1" }
"ui.statusline"          = { fg = "oldWhite", bg = "sumiInk0" }
"ui.menu.selected"       = { fg = "fujiWhite", bg = "waveBlue2", modifiers = ["bold"] }
"ui.popup"               = { fg = "fujiWhite", bg = "sumiInk0" }
"ui.popup.border"        = { fg = "sumiInk6" }

