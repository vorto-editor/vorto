[package]
name = "vorto"
version = "0.15.2"
edition = "2024"
description = "A Vim-flavored modal terminal editor with batteries included: tree-sitter, LSP, fuzzy pickers, vim-surround, multi-cursor, and optional Copilot."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/vorto-editor/vorto"
homepage = "https://docs.vorto-editor.dev/"
keywords = ["editor", "terminal", "tui", "tree-sitter", "lsp"]
categories = ["text-editors", "command-line-utilities"]

[features]
default = []
# Embed pre-built tree-sitter grammar libraries (gzip-compressed) into the
# binary and extract them into `grammar_dir` on first run. Off by default so
# `cargo install vorto` stays lean and network-free; enabled for the
# pre-built release binaries, which run `vorto grammar bundle` per target
# first to populate `assets/grammars-prebuilt/<target-triple>/`.
bundled-grammars = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.26"
cc = "1"
libloading = "0.9"
flate2 = "1"
include_dir = "0.7"
arboard = "3"
time = { version = "0.3", features = ["formatting", "local-offset"] }
unicode-width = "0.2"
portable-pty = "0.9"
alacritty_terminal = "0.26.0"
similar = { version = "3", default-features = false, features = ["std"] }
